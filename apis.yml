name: Sandbar
description: >-
  Sandbar is a consumer hardware and AI company behind Stream, a private voice
  ring and conversational notes app. Worn on the finger, Stream pairs a discreet
  private microphone, a glass touchpad, and silent haptics with an on-device
  "Inner Voice" assistant so people can capture notes, reminders, and todos,
  dictate speech-to-text across any iOS or Mac app, and think aloud without
  reaching for a phone. Backed by Kindred Ventures and True Ventures, Sandbar is
  a preorder-stage consumer product; it publishes a marketing site, an About/Us
  page, and a Careers page, but no public developer portal, API, or SDK surface
  was found during enrichment.
